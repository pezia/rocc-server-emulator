machine:
  - path: /media/DSCF3240.JPG
    title: The ROCC cabinet
    alt: Front view of the ROCC cabinet with its control panel and dark drive window.
    caption: Owner-supplied photograph of the cabinet, showing the front-panel controls and ROCC branding.
  - path: /media/DSCF3229.JPG
    title: The terminal
    alt: ROCC CRT terminal with a blank screen, with part of its keyboard visible beside it.
    caption: Owner-supplied photograph of the ROCC terminal and its CRT display.
  - path: /media/DSCF3219.JPG
    title: The keyboard
    alt: ROCC keyboard with dedicated field and document keys and a separate numeric keypad.
    caption: Owner-supplied photograph of the keyboard, including its field, document, and numeric entry keys.
  - path: /media/DSCF3244.JPG
    title: Identification plate
    alt: ROCC identification plate marked unit R3545, serial 2934, and 240 volts, 5 amps, 50 hertz.
    caption: Owner-supplied close-up of the cabinet identification plate and electrical ratings.
  - path: /media/DSCF3249.JPG
    title: Inside the cabinet
    alt: Open ROCC cabinet showing circuit boards, ribbon cables, and rows of external connectors.
    caption: Owner-supplied photograph of the internal boards, ribbon cabling, and connector panel.
screenshots:
  - path: /media/screenshot_after_boot.png
    title: WMS4 main menu
    alt: WMS4 main menu listing data entry, database access, advanced processing, diagnostics, and other options at a selection prompt.
    caption: The WMS4 main menu after boot, ready for an operator to select a function.
  - path: /media/screenshot_system_customization.png
    title: System customization
    alt: WMS system customization screen showing memory and disk settings and software base level 4.1B/050, with customer details obscured.
    caption: System configuration showing memory, disk, and WMS settings, including software base level 4.1B/050. Customer details are obscured.
  - path: /media/screenshot_dynamic_memory_evaluator.png
    title: Dynamic Core Evaluator
    alt: Dynamic Core Evaluator displaying memory request counters, page counts, free pages, and global read statistics.
    caption: The guest memory diagnostic reports page usage, free pages, and global memory and read request counters.
  - path: /media/screenshot_customer_program.png
    title: Customer application
    alt: Hungarian-language application menu offering display, data entry, and exit options, with identifying text obscured.
    caption: A customer application running in the emulator, with Hungarian menu options for display, data entry, and exit. Identifying text is obscured.
