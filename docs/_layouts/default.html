<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#132e28">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="ROCC emulator home"><span class="brand-icon" aria-hidden="true">r.</span> ROCC<span class="wordmark-detail">/ emulator</span></a>
    <nav aria-label="Main navigation"><a href="{{ '/#the-machine' | relative_url }}">The machine</a><a href="{{ '/#the-emulator' | relative_url }}">The emulator</a><a class="repo-link" href="https://github.com/pezia/rocc-server-emulator">GitHub <span aria-hidden="true">↗︎</span></a></nav>
  </header>
  <main id="main" class="wrap {% unless page.home %}document{% endunless %}">{{ content }}</main>
  <footer class="site-footer wrap"><a class="wordmark" href="{{ '/' | relative_url }}">ROCC / emulator</a><p>Experimental emulator · Hardware identification is provisional.</p><a href="https://github.com/pezia/rocc-server-emulator">Source code <span aria-hidden="true">↗︎</span></a></footer>
</body>
</html>
